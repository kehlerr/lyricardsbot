version: '3.9'

services:
  app-bot:
    image: "${APP_IMAGE_NAME}"
    container_name: "${APP_INSTANCE_CONTAINER_NAME}"
    extends:
      file: docker-compose-base.yml
      service: app_base
    command: bash -c "python main.py"
    restart: on-failure:15
    networks:
      lyricardsbot-network:
        aliases:
          - "${LYRICARDSBOT_WEBHOOK_HOST}"
